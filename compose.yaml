# Docker Compose configuration for gajae-way runtime
# Usage: docker compose up (after running: docker compose run -it setup gajaeway setup)

services:
  gajaeway-gateway:
    build: .
    container_name: gajaeway-gateway
    environment:
      GAJAEWAY_HOME: /home/gajaeway/.gajaeway
      HOME: /home/gajaeway
      # Pass GJC_EXECUTABLE if gjc is available in the build container
      # Otherwise, mount a volume and set: GJC_EXECUTABLE=/host/path/to/gjc
    volumes:
      # Persistent home directory with all state, config, memory, and database
      - gajaeway_home:/home/gajaeway/.gajaeway
    ports:
      # Gateway socket is local-only (Unix domain socket), not exposed to Docker bridge
      # Use 'docker compose exec' or volume mount for client connections
      - "127.0.0.1::9000"  # placeholder; actual socket is at ~/.gajaeway/gateway.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "gajaeway", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Adapter services (only enabled ones start; see .env.example or setup output)
  gajaeway-discord:
    build: .
    container_name: gajaeway-discord
    environment:
      GAJAEWAY_HOME: /home/gajaeway/.gajaeway
      HOME: /home/gajaeway
    volumes:
      - gajaeway_home:/home/gajaeway/.gajaeway
    restart: unless-stopped
    depends_on:
      gajaeway-gateway:
        condition: service_healthy
    command: ["gajaeway-discord"]
    profiles:
      - discord

  gajaeway-slack:
    build: .
    container_name: gajaeway-slack
    environment:
      GAJAEWAY_HOME: /home/gajaeway/.gajaeway
      HOME: /home/gajaeway
    volumes:
      - gajaeway_home:/home/gajaeway/.gajaeway
    restart: unless-stopped
    depends_on:
      gajaeway-gateway:
        condition: service_healthy
    command: ["gajaeway-slack"]
    profiles:
      - slack

  gajaeway-telegram:
    build: .
    container_name: gajaeway-telegram
    environment:
      GAJAEWAY_HOME: /home/gajaeway/.gajaeway
      HOME: /home/gajaeway
    volumes:
      - gajaeway_home:/home/gajaeway/.gajaeway
    restart: unless-stopped
    depends_on:
      gajaeway-gateway:
        condition: service_healthy
    command: ["gajaeway-telegram"]
    profiles:
      - telegram

  # Setup helper: runs one-time setup if config doesn't exist
  setup-check:
    build: .
    container_name: gajaeway-setup
    environment:
      GAJAEWAY_HOME: /home/gajaeway/.gajaeway
      HOME: /home/gajaeway
    volumes:
      - gajaeway_home:/home/gajaeway/.gajaeway
    stdin_open: true
    tty: true
    # This runs setup if no config exists; otherwise just exits
    entrypoint: sh
    command:
      - -c
      - |
        if [ ! -f $$GAJAEWAY_HOME/config.json ]; then
          echo "Welcome to gajae-way!"
          echo "Running first-time setup..."
          gajaeway setup
        else
          echo "Configuration found. Skipping setup."
        fi
    profiles:
      - setup

volumes:
  gajaeway_home:
    name: gajaeway_home
    driver: local

# Usage:
#
# First run (interactive setup):
#   docker compose run --rm -it -e GAJAEWAY_DISCORD_TOKEN=$TOKEN setup gajaeway setup
#
# Or with environment file:
#   docker compose run --rm -it --env-file .env.gajaeway setup gajaeway setup
#
# Or interactively (no env vars needed):
#   docker compose run --rm -it setup gajaeway setup
#
# Start gateway and enabled adapters:
#   docker compose up
#
# List configured adapters:
#   docker compose exec gajaeway-gateway gajaeway setup --status
#
# Access the shell inside gateway container:
#   docker compose exec gajaeway-gateway sh
#
# View logs:
#   docker compose logs -f gajaeway-gateway
#
# Restart just the Discord adapter:
#   docker compose restart gajaeway-discord
#
# Start with specific adapter(s) only:
#   docker compose --profile discord up    # just Discord
#   docker compose --profile slack up      # just Slack
#   docker compose --profile discord,slack up  # Discord + Slack
